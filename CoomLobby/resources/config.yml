    murder_mystery:
      enabled: true
      world: "mm_1"
      max-players: 16
      permission: ""
      icon: "textures/ui/coomlobby/murder_mystery"
      name:
        ru: "Murder Mystery"
        en: "Murder Mystery"
      description:
        ru: "Найдите убийцу"
        en: "Find the murderer"
      gamemode: "adventure"
      spawn-point: {x: 0.5, y: 65.0, z: 0.5, yaw: 0.0, pitch: 0.0}

# ---------------------------------------------------------------------------
# Lobby protection
# ---------------------------------------------------------------------------
protection:
  block-break: true
  block-place: true
  item-drop: true
  item-pickup: true
  damage: true
  hunger: true
  chat: true
  interact-blocks: true
  use-items: true
  projectiles: true
  flight: true
  force-gamemode: true
  inventory-transaction: true
  # Items the player may use in the lobby even when "use-items" is true
  # (the selector item is always allowed). Empty = everything is blocked
  # except the items listed in "blocked-items".
  allowed-items:
    - "minecraft:compass"
  # Items that may never be used in the lobby.
  blocked-items:
    - "minecraft:ender_pearl"
    - "minecraft:snowball"
    - "minecraft:egg"
    - "minecraft:bucket"
    - "minecraft:water_bucket"
    - "minecraft:lava_bucket"
    - "minecraft:potion"
    - "minecraft:splash_potion"
    - "minecraft:lingering_potion"
    - "minecraft:fishing_rod"
    - "minecraft:flint_and_steel"
    - "minecraft:fire_charge"
    - "minecraft:bow"
    - "minecraft:crossbow"
    - "minecraft:arrow"
    - "minecraft:firework_rocket"
    - "minecraft:end_crystal"
    - "minecraft:tnt"
  # Minimum delay (seconds) between two identical protection warnings.
  warning-cooldown: 5

# ---------------------------------------------------------------------------
# Automatic advertisements
# ---------------------------------------------------------------------------
ads:
  enabled: true
  interval-seconds: 600
  # rotate = messages are sent in order, random = random message each time
  order: "rotate"
  # true  = only players inside lobby worlds receive the ads
  # false = every player on the server receives the ads
  lobby-only: false
  # Fallback used for {server_ip} when the server listens on a wildcard address.
  ip-fallback: "play.example.com"
  messages:
    ru:
      - "&e[CoomLobby] &fНовый сезон BedWars уже доступен!"
      - "&aОнлайн сейчас: &f{online}&a игроков"
      - "&eЗаходи: &f{server_ip}"
    en:
      - "&e[CoomLobby] &fThe new BedWars season is live!"
      - "&aOnline right now: &f{online}&a players"
      - "&eJoin us: &f{server_ip}"

# ---------------------------------------------------------------------------
# Resource pack (.mcpack)
# ---------------------------------------------------------------------------
resource-pack:
  enabled: true
  # Build plugin_data/CoomLobby/CoomLobbyRP.mcpack from the shipped sources
  # (resources/rp/CoomLobbyRP) when the plugin version changes.
  build: true
  # File name inside plugin_data/CoomLobby (or an absolute path).
  file: "CoomLobbyRP.mcpack"
  # Folder inside plugin_data/CoomLobby that receives the RP sources.
  pack-folder: "rp/CoomLobbyRP"
  # Force clients to accept the pack before they can play.
  force-accept: false
  # Strict integrity check: if not empty, the pack header UUID must match
  # this value, otherwise the pack is not sent at all.
  expected-uuid: ""
  # Rebuild the pack on every plugin start (useful while designing textures).
  rebuild-always: false

# ---------------------------------------------------------------------------
# Player storage (statistics & settings)
# ---------------------------------------------------------------------------
storage:
  # sqlite | yaml | auto  (auto = sqlite when the PDO SQLite driver exists)
  type: "auto"
  sqlite:
    file: "coomlobby.db"
  yaml:
    file: "players.yml"
